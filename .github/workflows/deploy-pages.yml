name: Deploy to GitHub Pages

# Deploys whenever the repository's default branch is pushed (whatever it is named), or on demand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Build single-file bundle
        run: node scripts/build-single.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data _site/
          cp dist/index.html _site/offline.html
      # One-time setup: a repository admin must turn Pages on at
      # Settings > Pages > Build and deployment > Source: GitHub Actions.
      # This step cannot do it: creating a Pages site needs Administration:write,
      # which the workflow's GITHUB_TOKEN never has (enablement: true fails with
      # "Resource not accessible by integration"). Until Pages is on, this step
      # fails with "Get Pages site failed".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
